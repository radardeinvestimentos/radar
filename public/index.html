<!doctype html>
<html lang="pt-BR" data-theme="dark" data-brand="verde" data-fundo="misto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<title>Radar do Assessor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M5 21l6-7 5 4 10-11' fill='none' stroke='%232fd68a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/sora-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem('radar.theme');if(t==='light')document.documentElement.dataset.theme='light';}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="bg" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">
  <defs>
    <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="-80" y1="0" x2="1540" y2="0"><stop offset="0" class="st0"/><stop offset=".35" class="st1"/><stop offset=".7" class="st1"/><stop offset="1" class="st0"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sv0"/><stop offset="1" class="sv1"/></linearGradient>
    <radialGradient id="gh"><stop offset="0" class="sv0"/><stop offset="1" class="sv1"/></radialGradient>
  </defs>
  <g class="f f-brisa">
    <g class="drift">
      <path class="ln wd" d="M-80 640 C220 520 480 760 820 620 S1280 430 1540 520"/>
      <path class="ln" stroke-width="1.5" opacity=".55" d="M-80 640 C220 520 480 760 820 620 S1280 430 1540 520"/>
      <path class="ln" stroke-width="1.1" opacity=".38" d="M-80 690 C260 580 520 800 860 670 S1300 500 1540 580"/>
      <path class="ln" stroke-width=".9" opacity=".28" d="M-80 745 C300 640 560 840 900 725 S1320 560 1540 640"/>
      <path class="ln" stroke-width=".8" opacity=".2" d="M-80 800 C340 700 600 880 940 780 S1340 620 1540 700"/>
    </g>
    <g class="drift2">
      <path class="ln wd" d="M300 -40 C620 120 900 20 1180 150 S1420 260 1540 220"/>
      <path class="ln" stroke-width="1.3" opacity=".45" d="M300 -40 C620 120 900 20 1180 150 S1420 260 1540 220"/>
      <path class="ln" stroke-width=".9" opacity=".3" d="M430 -40 C730 150 960 70 1240 195 S1440 300 1540 285"/>
      <path class="ln" stroke-width=".8" opacity=".2" d="M-80 330 C300 240 640 410 1000 280 S1400 190 1540 215"/>
    </g>
  </g>
  <g class="f f-ondas">
    <g class="drift">
      <path class="fill" d="M-40 760 C240 690 480 830 760 770 S1200 680 1480 740 L1480 940 L-40 940Z"/>
      <path class="ln" stroke-width="1.2" opacity=".5" d="M-40 760 C240 690 480 830 760 770 S1200 680 1480 740"/>
    </g>
    <g class="drift2">
      <path class="fill" opacity=".7" d="M-40 815 C300 755 560 870 860 825 S1260 760 1480 805 L1480 940 L-40 940Z"/>
      <path class="fill" opacity=".6" d="M1480 -20 L1480 230 C1260 195 1050 60 850 -20Z"/>
      <path class="ln" stroke-width="1" opacity=".35" d="M850 -20 C1050 60 1260 195 1480 230"/>
    </g>
  </g>
  <g class="f f-nevoa">
    <g class="drift">
      <ellipse class="halo" cx="1240" cy="40" rx="760" ry="400"/>
      <ellipse class="halo" cx="140" cy="880" rx="700" ry="380" opacity=".85"/>
    </g>
    <g class="drift2">
      <ellipse class="halo" cx="760" cy="470" rx="980" ry="120" opacity=".32" transform="rotate(-16 760 470)"/>
    </g>
  </g>
</svg>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#001417" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l5-6 4 3.5L21 5"/></svg></span>
      <div>
        <h1>Radar do Assessor</h1>
        <p class="status" aria-live="polite"><span id="pulse" class="pulse" aria-hidden="true"></span><span id="statusText">Carregando…</span></p>
      </div>
    </div>
    <div class="actions">
      <button id="theme" class="btn" type="button" aria-label="Alternar tema claro e escuro">Tema claro</button>
      <button id="refresh" class="btn primary" type="button">Atualizar</button>
    </div>
  </div>
  <nav class="wrap tabs sections" id="sections" role="tablist" aria-label="Seções"></nav>
  <div class="wrap controls" id="controls">
    <label class="field"><span>Período</span>
      <select id="period">
        <option value="today">Hoje</option>
        <option value="24">Últimas 24h</option>
        <option value="48">Últimas 48h</option>
        <option value="72">Últimas 72h</option>
      </select>
    </label>
    <label class="field"><span>Origem</span>
      <select id="region">
        <option value="">Brasil e internacional</option>
        <option value="BR">Só Brasil</option>
        <option value="INT">Só internacional</option>
      </select>
    </label>
    <label class="field"><span>Portal</span>
      <select id="source"><option value="">Todos</option></select>
    </label>
    <label class="field grow"><span>Buscar</span>
      <input id="q" type="search" placeholder="Selic, Petrobras, FIIs, tarifa" autocomplete="off">
    </label>
  </div>
  <nav class="wrap tabs topics" id="tabs" role="tablist" aria-label="Tópicos"></nav>
</header>

<main class="wrap" id="main" tabindex="-1">
  <div id="list" class="list" role="tabpanel"></div>
</main>

<footer class="wrap foot">
  <details id="health"><summary>Saúde das fontes</summary><div id="healthBody"></div></details>
  <details id="api"><summary>Usar como API (JSON)</summary><div id="apiBody"></div></details>
  <p class="disclaimer" id="disclaimer"></p>
  <p id="actionsLink" class="small"></p>
  <p class="brandline"><b>Grupo</b> Ável</p>
</footer>

<script src="match.js" defer></script>
<script src="calc.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
