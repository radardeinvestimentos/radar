name: Atualizar notícias

on:
  schedule:
    # Horário de Brasília ~06h–23h: a cada 15 min. Madrugada: de hora em hora.
    # (cron do GitHub é UTC e "melhor esforço": pode atrasar alguns minutos)
    - cron: "*/15 9-23,0-2 * * *"
    - cron: "5 3-8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma coleta por vez; se uma nova começar, a anterior termina antes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar, classificar e analisar
        env:
          # O histórico vem do próprio site publicado (evita commitar dados a cada 15 min).
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/news.json
          # Opcional: análise com IA (Gemini, camada gratuita). Se não houver secret, é ignorado.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/collect.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
